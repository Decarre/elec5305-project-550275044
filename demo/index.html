<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instrument Activity | ELEC5305</title>
<style>
  :root{color-scheme:dark;--bg:#101719;--panel:#172123;--line:#344548;--muted:#b8c9c5;--mint:#a8f5cd;--amber:#f5ce8a}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f7f5;font:16px/1.5 "Instrument Sans","Segoe UI",sans-serif}
  main{max-width:1220px;margin:auto;padding:32px clamp(18px,4vw,55px)}
  header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}
  h1{font-size:clamp(32px,5vw,58px);line-height:1.02;letter-spacing:-.055em;margin:6px 0 0}
  h2{font-size:20px;margin:0}p{margin:0;color:var(--muted)}.course{color:var(--mint);font-weight:650}.model{text-align:right}
  section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
  .controls,.section-head,.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .section-head{justify-content:space-between;margin-bottom:14px}
  button,.upload{border:1px solid #537075;border-radius:8px;background:#202e31;color:inherit;padding:9px 14px;font:inherit;cursor:pointer}
  button[aria-pressed=true]{border-color:var(--mint);color:var(--mint)}button:disabled{opacity:.55;cursor:wait}
  button:focus-visible,.upload:focus-within,a:focus-visible{outline:2px solid white;outline-offset:3px}
  #run{margin-left:auto;background:var(--mint);color:#10251b;font-weight:750;border-color:var(--mint)}
  audio{width:100%;margin-top:13px;height:40px}#status{min-height:24px;margin-top:7px}
  .legend{font-size:14px;color:var(--muted)}.chip::before{content:"";display:inline-block;width:15px;height:9px;border-radius:2px;margin-right:6px;background:var(--mint)}
  .chip.ref::before{background:repeating-linear-gradient(135deg,var(--amber) 0 2px,#635139 2px 5px)}
  .row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:center;margin:8px 0}
  .row strong{font-size:16px}.row.focus strong{color:var(--amber)}
  .lane,.wave{height:52px;position:relative;border-radius:7px;border:1px solid var(--line);background:#121b1d;cursor:crosshair}
  .lane{background-image:linear-gradient(transparent 49%,#344548 50%,transparent 52%),linear-gradient(to right,#344548 1px,transparent 1px);background-size:100% 100%,20% 100%}
  .row.focus .lane{border-color:#9f8055}
  .bar{position:absolute;top:5px;height:17px;min-width:1px;padding:0;border:1px solid var(--mint);border-radius:3px;background:var(--mint);color:#10251b}
  .bar.reference{top:30px;background:repeating-linear-gradient(135deg,#e7bb75 0 2px,#745b38 2px 6px);border-color:var(--amber)}
  .bar:hover{filter:brightness(1.22)}
  .playhead{position:absolute;top:0;bottom:0;width:2px;background:white;pointer-events:none;z-index:2}
  .wave{height:62px;overflow:hidden}.wave canvas{display:block;width:100%;height:100%;pointer-events:none}
  .wave-label{color:var(--muted);font-size:14px}
  #finding{color:var(--amber);margin-top:10px;font-weight:650}
  .ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
  a{color:var(--amber)}[hidden]{display:none!important}.upload input{position:absolute;opacity:0;width:1px;height:1px}
  @media(max-width:620px){header{display:block}.model{text-align:left;margin-top:8px}section{padding:14px}#run{margin-left:0}.row{grid-template-columns:57px 1fr}}
</style>
<main>
  <header>
    <div><p class="course">ELEC5305 · Ryan Hu</p><h1>Instrument Activity</h1></div>
    <p class="model">Attention pooling · Slakh2100-redux (160 tracks)</p>
  </header>
  <section aria-label="Audio and prediction">
    <div class="controls">
      <button id="success" type="button" aria-pressed="true">Matched onset</button>
      <button id="failure" type="button" aria-pressed="false">Missed instruments</button>
      <label class="upload">Choose WAV<input id="upload" type="file" accept=".wav,audio/wav"></label>
      <button id="run" type="button">Run prediction</button>
    </div>
    <audio id="audio" controls preload="auto" src="/audio/success" aria-label="Selected audio"></audio>
    <p id="status" role="status">5-second validation clip</p>
  </section>
  <section aria-labelledby="timeline-title">
    <div class="section-head">
      <h2 id="timeline-title">Activity timeline</h2>
      <div class="legend"><span class="chip">Prediction</span><span class="chip ref" id="ref-key">MIDI reference</span></div>
    </div>
    <div class="row"><span>Time</span><div class="ticks" id="ticks"></div></div>
    <div class="row"><span class="wave-label">Audio</span><div class="wave" id="wave"><canvas aria-hidden="true"></canvas><span class="playhead"></span></div></div>
    <div id="tracks"></div>
    <p id="finding" hidden></p>
    <div class="footer">
      <p id="detail" aria-live="polite">Click a lane or interval to seek in the audio.</p>
    </div>
  </section>
</main>
<script src="/app.js"></script>
</html>
